<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="Plumix-Net" />
    <meta name="theme-color" content="#0b0a10" />

    <link rel="icon" type="image/png" sizes="32x32" href="/logo-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/logo-180.png" />

    <!-- Inter and JetBrains Mono are self-hosted via @fontsource (imported in
         src/main.tsx), so no third-party font origin sits on the critical path. -->

    <link rel="alternate" type="application/rss+xml" title="Plumix blog" href="/blog/rss.xml" />

    <link rel="preconnect" href="https://img.shields.io" />

    <!-- Everything between these markers is replaced per route by
         scripts/prerender.mjs. The tags below are the dev-server defaults. -->
    <!--seo-start-->
    <title>Plumix — Flutter-like UI framework for C#</title>
    <meta
      name="description"
      content="Plumix brings Flutter's Widget → Element → RenderObject architecture to .NET. Build cross-platform desktop UIs in C# with the same mental model as Flutter."
    />
    <!--seo-end-->
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
