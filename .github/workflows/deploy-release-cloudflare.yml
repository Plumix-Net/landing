name: Deploy release branch to Cloudflare Pages

on:
  push:
    branches:
      - release
  workflow_dispatch:

concurrency:
  group: deploy-release-cloudflare
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      # Direct Upload: the build runs here, Pages only hosts dist/. The project is
      # "plumix-landing" with production branch "release", so this is a production deploy.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          command: pages deploy dist --project-name=plumix-landing --branch=release --commit-dirty=true
